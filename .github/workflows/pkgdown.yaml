# Deploys via GitHub's OIDC-based Pages flow (upload-pages-artifact +
# deploy-pages), not the git-branch-push approach usethis's template
# defaults to. That push approach needs `contents: write` on the default
# GITHUB_TOKEN, which this repo's (org-wide) "read" default workflow
# permissions setting caps regardless of what this file's `permissions:`
# block requests - confirmed by a failed deploy ("Write access to
# repository not granted") even with contents: write declared here.
# The OIDC flow sidesteps that entirely: it only needs pages: write and
# id-token: write, which do work under the same read default (this mirrors
# the working setup in jprybylski/lengua's own pages.yml).
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions:
  contents: read

concurrency:
  group: pkgdown
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # jprybylski/lengua is a private repo, so cloning it as a submodule
      # needs the LENGUA_PAT secret (a fine-grained PAT with read-only
      # Contents access to that repo).
      - uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.LENGUA_PAT || github.token }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
