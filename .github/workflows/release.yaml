# Release-on-merge automation, driven by the VERSION file (see
# .github/scripts/sync-release-metadata.R). Never touches CRAN - only
# creates/refreshes a GitHub release and tag, and syncs DESCRIPTION/NEWS.md
# to match VERSION.
#
# Ported from ../deckifyr's release.yaml (itself from ../quartifyr, itself
# from ../xpose.xtras), same deploy-key mechanism: a write-enabled SSH
# deploy key (`RELEASE_DEPLOY_KEY`) pushes the release commit/tag, ahead of
# main becoming a protected branch here too.
#
# One wrinkle this repo has that the siblings don't: `lengua` (vendored as a
# git submodule at src/rust/lengua) is itself a private repo, so the initial
# checkout below still needs the same LENGUA_PAT fine-grained token
# R-CMD-check.yaml uses just to fetch the submodule - see the comment there.
# LENGUA_PAT is read-only, so it's only used for that first checkout; the
# deploy-key steps below then repoint the origin remote at SSH before
# anything is pushed.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview version detection/changelog without writing, tagging, or publishing anything"
        type: boolean
        default: true

name: release.yaml

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.LENGUA_PAT || github.token }}

      - name: Load deploy key
        if: env.DRY_RUN != 'true'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Push over SSH via the deploy key
        if: env.DRY_RUN != 'true'
        run: |
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git remote set-url origin "git@github.com:${{ github.repository }}.git"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Sync release metadata (DESCRIPTION/NEWS.md) to VERSION
        id: sync
        run: Rscript .github/scripts/sync-release-metadata.R

      - name: Commit release metadata changes
        if: steps.sync.outputs.changed == 'true' && env.DRY_RUN != 'true'
        run: |
          git commit -am "chore: sync release metadata for ${{ steps.sync.outputs.version }}"
          git push origin HEAD:main

      - name: Check whether this commit is already released
        id: check
        if: env.DRY_RUN != 'true'
        run: |
          already_tagged="$(git rev-parse -q --verify "refs/tags/${{ steps.sync.outputs.tag }}" || true)"
          if [ "${{ steps.sync.outputs.changed }}" = "false" ] && [ "$already_tagged" = "$(git rev-parse HEAD)" ]; then
            echo "This commit's metadata already matches VERSION and the tag already points here - nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package tarball
        if: env.DRY_RUN != 'true' && steps.check.outputs.skip != 'true'
        run: R CMD build . --compact-vignettes=gs+qpdf

      - name: Create release
        if: env.DRY_RUN != 'true' && steps.check.outputs.skip != 'true' && steps.sync.outputs.action == 'new'
        run: |
          gh release create "${{ steps.sync.outputs.tag }}" \
            "${{ steps.sync.outputs.tarball }}" \
            --target "$(git rev-parse HEAD)" \
            --title "${{ steps.sync.outputs.tag }}" \
            --notes-file changelog.md

      - name: Refresh existing release
        if: env.DRY_RUN != 'true' && steps.check.outputs.skip != 'true' && steps.sync.outputs.action == 'refresh'
        run: |
          git tag -f "${{ steps.sync.outputs.tag }}" "$(git rev-parse HEAD)"
          git push origin "${{ steps.sync.outputs.tag }}" --force
          gh release edit "${{ steps.sync.outputs.tag }}" --notes-file changelog.md
          gh release upload "${{ steps.sync.outputs.tag }}" "${{ steps.sync.outputs.tarball }}" --clobber
