# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          # R for Windows links compiled code with Rtools' MinGW toolchain,
          # not MSVC, so the extendr crate must build for the GNU-ABI target
          # (rextendr's own generated src/Makevars.win.in computes exactly
          # this target: TARGET = ...-pc-windows-gnu). r-lib/actions/setup-r
          # installs Rtools and puts its gcc on PATH automatically on
          # windows-latest, which is what makes that target linkable here.
          - {os: windows-latest, r: 'release', rust_target: 'x86_64-pc-windows-gnu'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      # jprybylski/lengua is a private repo, so the default GITHUB_TOKEN
      # (scoped to this repo only) can't clone it as a submodule. A
      # fine-grained PAT with read-only "Contents" access to jprybylski/lengua,
      # stored as the LENGUA_PAT repo secret, is required for this checkout
      # to succeed - falls back to the default token (which will fail on the
      # submodule step) if that secret isn't set.
      - uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.LENGUA_PAT || github.token }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.rust_target }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
